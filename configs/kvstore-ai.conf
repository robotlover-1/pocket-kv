# kvstore 配置 —— 为 ai-chat 提供多轮上下文缓存
# 启动：cd 9.1-kvstore && ./kvstore/kvstore configs/kvstore-ai.conf
# 说明：ai-chat-service 的 dev.config.yaml 里 redis 指向 127.0.0.1:5160，pwd=123456
port=5160
role=master
mem_backend=libc
net_backend=reactor
log_mode=info
# dump/aof 相对路径以启动时的工作目录（9.1-kvstore 根目录）为基准
dump_path=runtime/kvstore-ai.dump
aof_path=runtime/kvstore-ai.aof
# 纯 TCP，无需 RDMA/BPF
repl_fullsync_transport=tcp
repl_realtime_transport=tcp
kprobe_enabled=0
ebpf_enabled=0
# 访问密码（go-redis 连接时发 AUTH）
requirepass=123456
